<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Croma Drip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/cart.css"
  >

  <link rel="stylesheet"
   href="css/search.css">

   <link rel="stylesheet"
    href="css/menu.css">
</head>

<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">


    <!-- MENU ESQUERDA -->

    <div class="header-left">

      <button
        class="icon-button menu-button"
        data-open-menu
        type="button"
        aria-label="Abrir menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>


    <!-- LOGO -->

    <a
      href="index.html"
      class="logo-link"
      aria-label="Croma Drip"
    >

      <img
        src="assets/logo.png"
        alt="Croma Drip"
        class="logo"
      >

    </a>


    <!-- ÍCONES DIREITA -->

    <div class="header-right">


      <!-- BUSCA -->

      <button
        class="icon-button"
        data-open-search
        type="button"
        aria-label="Pesquisar"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="10.5"
            cy="10.5"
            r="6.5"
          ></circle>

          <path
            d="M15.5 15.5L21 21"
          ></path>

        </svg>

      </button>


      <!-- CONTA -->

      <button
        class="icon-button account-icon"
        type="button"
        aria-label="Minha conta"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="9"
          ></circle>

          <circle
            cx="12"
            cy="9"
            r="2.7"
          ></circle>

          <path
            d="M7.5 18c.8-2.7 2.3-4 4.5-4s3.7 1.3 4.5 4"
          ></path>

        </svg>

      </button>


      <!-- CARRINHO -->

      <button
        class="icon-button cart-icon"
        id="openCart"
        type="button"
        aria-label="Abrir carrinho"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"
          ></path>

          <circle
            cx="9"
            cy="20"
            r="1"
          ></circle>

          <circle
            cx="18"
            cy="20"
            r="1"
          ></circle>

        </svg>


        <span
          class="cart-count"
          id="cartCount"
        >
          0
        </span>

      </button>

    </div>

  </header>



  <!-- =========================
       CONTEÚDO
  ========================== -->

  <main>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >

        <source
          src="assets/hero-video.mp4"
          type="video/mp4"
        >

        Seu navegador não suporta vídeos em HTML5.

      </video>


      <div class="hero-content">

        <a
          href="#catalogo"
          class="catalog-button"
        >
          VER CATÁLOGO
        </a>

      </div>

    </section>



    <!-- =========================
         CATÁLOGO
    ========================== -->

    <section
      class="catalogo"
      id="catalogo"
    >


      <div class="catalog-header">

        <div>

          <span class="catalog-kicker">
            CATÁLOGO
          </span>

          <h2>
            TODOS OS PRODUTOS
          </h2>

        </div>

      </div>


      <!--
        PRODUTOS GERADOS
        AUTOMATICAMENTE PELO home.js
      -->

      <div
        class="products-grid"
        id="productsGrid"
      ></div>


    </section>

  </main>



  <!-- ==================================================
       OVERLAY DO CARRINHO
  =================================================== -->

  <div
    class="cart-overlay"
    id="cartOverlay"
  ></div>



  <!-- ==================================================
       CARRINHO LATERAL
  =================================================== -->

  <aside
    class="cart-drawer"
    id="cartDrawer"
    aria-label="Carrinho de compras"
  >


    <!-- =========================
         HEADER DO CARRINHO
    ========================== -->

    <div class="cart-header">

      <div>

        <span class="cart-kicker">
          SEU PEDIDO
        </span>

        <h2>
          CARRINHO
        </h2>

      </div>


      <button
        class="close-cart"
        id="closeCart"
        type="button"
        aria-label="Fechar carrinho"
      >
        ×
      </button>

    </div>



    <!-- =========================
         META FRETE GRÁTIS
    ========================== -->

    <div class="shipping-goal">


      <div class="shipping-goal-text">

        <span>
          FRETE GRÁTIS
        </span>

        <strong id="freeShippingGoalValue">
          R$ 499
        </strong>

      </div>


      <p id="shippingMessage">
        Faltam R$ 499,00 para frete grátis
      </p>


      <div class="shipping-progress">

        <div
          class="shipping-progress-bar"
          id="shippingProgressBar"
        ></div>

      </div>


    </div>



    <!-- =========================
         ITENS DO CARRINHO
    ========================== -->

    <div
      class="cart-items"
      id="cartItems"
    >


      <!-- ESTADO VAZIO -->

      <div
        class="empty-cart"
        id="emptyCart"
      >

        <p>
          Seu carrinho está vazio.
        </p>


        <button
          class="continue-shopping"
          id="continueShopping"
          type="button"
        >
          CONTINUAR COMPRANDO
        </button>

      </div>


    </div>



    <!-- =========================
         FOOTER DO CARRINHO
    ========================== -->

    <div class="cart-footer">


      <div class="cart-total">

        <span>
          SUBTOTAL
        </span>

        <strong id="cartSubtotal">
          R$ 0,00
        </strong>

      </div>


      <p class="shipping-note">
        Frete calculado durante o atendimento pelo WhatsApp.
      </p>


      <button
        class="cart-whatsapp"
        id="cartWhatsapp"
        type="button"
        disabled
      >
        FINALIZAR PELO WHATSAPP
      </button>


      <button
        class="continue-shopping-footer"
        id="continueShoppingFooter"
        type="button"
      >
        CONTINUAR COMPRANDO
      </button>


    </div>

  </aside>

  <footer class="site-footer">

  <p class="footer-copyright">
    CROMA DRIP © 2026
  </p>

  <div class="footer-developer">

    <span>
      DESENVOLVIDO POR
    </span>

    <img
      src="assets/dg-selo.png"
      alt="DG"
    >

  </div>

</footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/home.js"></script>

</body>

</html>
